<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>305 Web Service — OG image 1200×630</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap">
<link rel="stylesheet" href="../src/identity.css">
<style>
  @page { size: 1200px 630px; margin: 0; }
  html, body { width: 1200px; height: 630px; }

  .canvas { width: 1200px; height: 630px; background: var(--navy); }

  .monument { font-size: 640px; right: -210px; top: -70px; }

  .content { position: absolute; inset: 72px 80px; }

  .brand {
    font-size: 24px; font-weight: 700;
    letter-spacing: 0.24em; text-transform: uppercase;
    color: var(--paper);
  }
  .rule { width: 64px; height: 3px; background: var(--turquoise); margin-top: 22px; }

  .headline {
    position: absolute; left: 0; bottom: 84px;
    font-size: 62px; font-weight: 900;
    letter-spacing: -0.015em; line-height: 1.08;
    text-transform: uppercase;
    color: var(--paper);
    max-width: 820px;
  }

  .foot {
    position: absolute; left: 0; bottom: 0;
    display: flex; gap: 40px;
    font-size: 19px; font-weight: 600;
    letter-spacing: 0.24em; text-transform: uppercase;
  }
  .foot .a { color: var(--turquoise); }
  .foot .b { color: rgba(247, 249, 252, 0.6); }
</style>
</head>
<body>
  <div class="canvas">
    <div class="monument" aria-hidden="true">305</div>
    <div class="content">
      <div class="brand">305 Web Service</div>
      <div class="rule"></div>
      <div class="headline">We build digital experiences that grow your business.</div>
      <div class="foot">
        <span class="a">305webservice.com</span>
        <span class="b">Miami · Florida</span>
      </div>
    </div>
  </div>
</body>
</html>
