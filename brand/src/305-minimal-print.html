<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>305 Minimal NFC Card</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Manrope:wght@700&display=swap');
    *{box-sizing:border-box}html,body{margin:0;width:1082px;height:708px;overflow:hidden;background:#050d1a}
    body{color:#f7f9fc}.card{position:relative;width:1082px;height:708px;background:#050d1a}
    .front,.back{display:none;position:absolute;inset:0}.front.active,.back.active{display:block}
    .wordmark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:17px;
      font:700 71px/1 Manrope,sans-serif;letter-spacing:-.035em;text-transform:uppercase}
    .wordmark b{color:#2f78ff}.wordmark span{color:#f7f9fc}
    .back-copy{position:absolute;left:118px;top:246px;font:700 42px/1 DM Sans,sans-serif;
      letter-spacing:.18em;color:#f7f9fc}
    .url{position:absolute;left:118px;top:455px;font:400 37px/1 DM Sans,sans-serif;
      letter-spacing:-.015em;color:#96a2b2}
    .qr{position:absolute;right:118px;top:212px;width:283px;height:283px;background:#fff}
  </style>
</head>
<body>
  <main class="card">
    <section class="front"><div class="wordmark"><b>305</b><span>Web Service</span></div></section>
    <section class="back"><div class="back-copy">SCAN TO EXPLORE</div><div class="url">305webservice.com</div><img class="qr" src="../out/305-portal/_qr.svg" alt=""></section>
  </main>
  <script>document.querySelector(location.search.includes('back')?'.back':'.front').classList.add('active')</script>
</body>
</html>
