<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mabel Toledo — NFC back (CR80)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Fraunces:opsz,wght@9..144,400&display=swap">
<style>
  /* VISION IN MOTION — reverso. Más silencioso que el frente.
     Contenido exacto: frase · SCAN TO CONNECT · dominio · un solo QR. */
  @page { size: 91.6mm 59.98mm; margin: 0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 91.6mm; height: 59.98mm;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  body { background: #17151C; font-family: "Inter", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  .card { position: relative; width: 91.6mm; height: 59.98mm; overflow: hidden; }

  /* Mensaje a la izquierda, QR en el tercio derecho, ambos ópticamente centrados
     sobre la misma línea media. */
  /* Se sube respecto al centro para dejar sitio a la firma de EL CLOSET abajo,
     sin que ninguno de los dos bloques se sienta apretado. */
  .row {
    position: absolute; left: 8.5mm; right: 8.5mm;
    top: 24mm; transform: translateY(-50%);
    display: flex; align-items: center; justify-content: space-between; gap: 6mm;
  }
  .block { max-width: 44mm; }

  /* Firma de la tienda: el gancho del logo real + el nombre como TEXTO a 8 pt.
     El lockup completo se descartó porque su palabra «Shop» cae muy por debajo
     del mínimo de 8 pt al reducirlo a este tamaño. */
  .shop {
    position: absolute; left: 8.5mm; bottom: 8mm;
    display: flex; align-items: center; gap: 2mm;
  }
  .shop img { height: 5mm; width: auto; display: block; }
  .shop span {
    font-size: 8pt; font-weight: 500;
    letter-spacing: 0.14em; color: #D4AF37;
  }

  .lead {
    font-family: "Fraunces", Georgia, serif;
    font-size: 12.5pt; font-weight: 400;
    letter-spacing: 0.005em; line-height: 1.25;
    color: #F4EFE6;
  }
  /* Acento coral/dorado continuado con UNA línea corta. No es un patrón. */
  .rule { width: 13mm; height: 0.45mm; background: #D4AF37; margin: 3.2mm 0 3mm; }

  .scan {
    font-size: 9pt; font-weight: 500;
    letter-spacing: 0.16em; color: #C9C2B6;
  }

  /* Un solo QR: 25 mm (rango 23-25), K100 sobre blanco sólido. El área clara mide
     lo que el código necesita — patrón + quiet zone de 4 módulos — y nada más.
     Sin marco, sin sombra, sin logo dentro, sin módulos redondeados. */
  .qr { width: 25mm; height: 25mm; background: #FFFFFF; flex: none; }
  .qr img { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
  <div class="card">
    <div class="row">
      <div class="block">
        <div class="lead">Continue the<br>conversation.</div>
        <div class="rule"></div>
        <div class="scan">SCAN</div>
      </div>
      <div class="qr"><img src="assets/mabel/qr-mabel.svg" alt=""></div>
    </div>

    <div class="shop">
      <img src="assets/mabel/hanger.png" alt="">
      <span>EL CLOSET</span>
    </div>
  </div>
</body>
</html>
