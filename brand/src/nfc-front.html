<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>305 OBJECT — NFC front (CR80)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  /* 305 OBJECT — anverso.
     CR80 / ISO ID-1: 85.60 × 53.98 mm trim + 3 mm de sangrado por lado (provisional,
     se sustituye por la plantilla del fabricante) → lienzo 91.60 × 59.98 mm.
     Área segura: 3 mm desde el corte. Márgenes de composición: 5.5 mm desde el corte.
     Regla del encargo: identificar (wordmark) · tocar (símbolo + TAP). Nada más. */
  @page { size: 91.6mm 59.98mm; margin: 0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 91.6mm; height: 59.98mm;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  body {
    font-family: "Inter", Arial, sans-serif;
    /* Navy casi negro, PLANO. Sin degradado: en PVC mate un degradado se embarra. */
    background: #071426;
    -webkit-font-smoothing: antialiased;
  }
  .card { position: relative; width: 91.6mm; height: 59.98mm; overflow: hidden; }

  /* --- identificar --------------------------------------------------------
     Wordmark en el tercio superior, alineado al margen de composición.
     Tracking CERRADO (0.005em) para que «305 WEB SERVICE» lea como UNA unidad
     y no como dos piezas ensambladas — corrige el defecto de la versión actual. */
  .wordmark {
    position: absolute;
    left: 8.5mm;            /* 3 mm sangrado + 5.5 mm margen */
    top: 17.5mm;
    font-size: 16pt;
    font-weight: 700;
    letter-spacing: 0.005em;
    line-height: 1;
    white-space: nowrap;
    color: #F5F3EE;          /* blanco cálido */
  }
  /* Único acento de color de la pieza. El aqua se elimina por completo.
     MISMO peso que el resto: el color ya diferencia. Un 800 contra un 700 hacía
     que «305» leyera como una pieza pegada al nombre en vez de su primera palabra. */
  .wordmark .n { color: #146CFF; }
  /* Espacio entre «305» y «WEB SERVICE» ligeramente por debajo del espacio normal,
     para cerrar el bloque sin que las palabras se toquen. */
  .wordmark .sp { display: inline-block; width: 0.24em; }

  /* --- tocar ---------------------------------------------------------------
     Símbolo + TAP, alineados al área NFC. La bobina del inlay recorre casi todo
     el interior de la tarjeta, así que el indicador es una CONVENCIÓN de lectura,
     no una marca de posición del chip: se confirma con la plantilla del fabricante. */
  .tap {
    position: absolute;
    right: 8.5mm;
    bottom: 8.5mm;
    display: flex;
    align-items: center;
    gap: 2.4mm;
  }
  .tap svg { display: block; width: 6mm; height: 6mm; }
  .tap .label {
    font-size: 9pt;
    font-weight: 600;
    letter-spacing: 0.18em;
    color: #F5F3EE;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="wordmark"><span class="n">305</span><span class="sp"></span>WEB SERVICE</div>

    <div class="tap">
      <!-- Onda de proximidad: trazo 0.45 mm, dentro del mínimo de línea impresa. -->
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M9.5 6.5c2.6 2.1 2.6 8.9 0 11"
              stroke="#F5F3EE" stroke-width="1.7" stroke-linecap="round"/>
        <path d="M14 4c4 3.2 4 12.8 0 16"
              stroke="#F5F3EE" stroke-width="1.7" stroke-linecap="round"/>
        <path d="M18.5 1.5c5.4 4.3 5.4 17.7 0 21"
              stroke="#146CFF" stroke-width="1.7" stroke-linecap="round"/>
      </svg>
      <span class="label">TAP</span>
    </div>
  </div>
</body>
</html>
