<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>305 Web Service — Reel 01 · Qué hacemos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap">
<link rel="stylesheet" href="reel.css">
</head>
<body>
  <div class="canvas" id="canvas" data-theme="navy">

    <!-- E1 · 0.0–2.0 s: el 305 entra desde la derecha con máscara -->
    <div class="mon-mask" id="t-mon"><div class="mask-inner">305</div></div>

    <div id="t-brand" style="position:absolute; left:90px; top:880px;">
      <div class="ln"><span class="li brand-micro" style="font-size:44px;">305 Web Service</span></div>
      <div class="rule-t" style="margin-top:30px;"></div>
    </div>

    <!-- E2 · 2.0–4.5 s -->
    <div class="h-navy small" id="t-head">
      <span class="ln"><span class="li">Convertimos ideas</span></span>
      <span class="ln"><span class="li">en soluciones digitales</span></span>
    </div>

    <!-- E3–E6 · declaraciones sobre blanco -->
    <div class="st" id="t-s3">
      <div class="ln"><span class="li l1">Páginas web</span></div>
      <div class="ln"><span class="li l2">que representan tu negocio</span></div>
    </div>
    <div class="st" id="t-s4">
      <div class="ln"><span class="li l1">Tiendas en línea</span></div>
      <div class="ln"><span class="li l2">preparadas para vender</span></div>
    </div>
    <div class="st" id="t-s5">
      <div class="ln"><span class="li l1">Automatizaciones</span></div>
      <div class="ln"><span class="li l2">que ahorran tiempo</span></div>
    </div>
    <div class="st" id="t-s6">
      <div class="ln"><span class="li l1" style="font-size:72px;">SEO, mantenimiento</span></div>
      <div class="ln"><span class="li l2">y soporte</span></div>
    </div>

    <!-- E7 · 14.0–16.0 s: CTA -->
    <div class="cta-title" id="t-cta">
      <span class="ln"><span class="li">Hablemos</span></span>
      <span class="ln"><span class="li">de tu proyecto</span></span>
    </div>
    <div class="rule-t cta-rule" id="t-ctarule"></div>
    <div class="cta-web" id="t-ctaweb">305WEBSERVICE.COM</div>
    <div class="qr-block" id="t-qr">
      <div class="qr-card"><img src="../src/assets/qr-305webservice.svg" alt="Código QR: https://305webservice.com"></div>
      <div class="qr-caption">Escanea para conocer más</div>
    </div>

    <div class="sub" id="sub"></div>
  </div>

  <script src="timeline.js"></script>
  <script>
    window.REEL = {
      total: 16000,
      bgs: [
        { t0: 0, theme: "navy" },
        { t0: 4500, theme: "paper" },
        { t0: 14000, theme: "navy" },
      ],
      tracks: [
        { id: "t-mon", in: 0, out: 4500, enter: "maskx", dur: 450, exit: "fade", exitDur: 300 },
        { id: "t-brand", in: 300, out: 2000, enter: "lines", dur: 400, exit: "fade", exitDur: 250 },
        { id: "t-head", in: 2000, out: 4500, enter: "lines", dur: 420, stagger: 90, exit: "fade", exitDur: 280 },
        { id: "t-s3", in: 4500, out: 7000, enter: "lines", dur: 420, stagger: 90, exit: "fade", exitDur: 260 },
        { id: "t-s4", in: 7000, out: 9500, enter: "lines", dur: 420, stagger: 90, exit: "fade", exitDur: 260 },
        { id: "t-s5", in: 9500, out: 12000, enter: "lines", dur: 420, stagger: 90, exit: "fade", exitDur: 260 },
        { id: "t-s6", in: 12000, out: 14000, enter: "lines", dur: 420, stagger: 90, exit: "fade", exitDur: 260 },
        { id: "t-cta", in: 14000, out: 16000, enter: "lines", dur: 400, stagger: 90 },
        { id: "t-ctarule", in: 14200, out: 16000, enter: "rule", dur: 350 },
        { id: "t-ctaweb", in: 14300, out: 16000, enter: "fade", dur: 350 },
        { id: "t-qr", in: 14000, out: 16000, enter: "static" },
      ],
      subs: [
        { t0: 400, t1: 4400, text: "En 305 Web Service convertimos tus ideas en soluciones digitales." },
        { t0: 4600, t1: 9400, text: "Creamos páginas web, tiendas en línea" },
        { t0: 9600, t1: 13900, text: "y automatizaciones diseñadas para hacer crecer tu negocio." },
      ],
    };
    initReel();
  </script>
</body>
</html>
