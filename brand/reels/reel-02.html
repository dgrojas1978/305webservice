<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>305 Web Service — Reel 02 · 4 cosas que tu web debe hacer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap">
<link rel="stylesheet" href="reel.css">
<style>
  /* declaración única sobre blanco con número fantasma */
  .pt { position: absolute; left: 90px; right: 90px; top: 860px; }
  .pt .l2 { margin-top: 0; font-size: 68px; }
</style>
</head>
<body>
  <div class="canvas" id="canvas" data-theme="navy">

    <!-- E1 · 0.0–2.5 s -->
    <div class="h-navy" id="t-q">
      <span class="ln"><span class="li">¿Tu página web</span></span>
      <span class="ln"><span class="li">genera confianza?</span></span>
    </div>

    <!-- E2–E5 · números monumentales en contorno + requisito -->
    <div class="scene" id="t-p1">
      <div class="ghost-num">01</div>
      <div class="pt"><div class="ln"><span class="li l2">Debe verse profesional</span></div></div>
    </div>
    <div class="scene" id="t-p2">
      <div class="ghost-num">02</div>
      <div class="pt"><div class="ln"><span class="li l2">Debe funcionar en móvil</span></div></div>
    </div>
    <div class="scene" id="t-p3">
      <div class="ghost-num">03</div>
      <div class="pt"><div class="ln"><span class="li l2">Debe ser rápida</span></div></div>
    </div>
    <div class="scene" id="t-p4">
      <div class="ghost-num">04</div>
      <div class="pt">
        <div class="ln"><span class="li l2">Debe convertir</span></div>
        <div class="ln"><span class="li l2">visitas en clientes</span></div>
      </div>
    </div>

    <!-- E6 · 12.5–14.5 s -->
    <div class="h-navy small" id="t-claim">
      <span class="ln"><span class="li">No es solo una página.</span></span>
      <span class="ln"><span class="li">Es parte de tu negocio.</span></span>
    </div>

    <!-- E7 · 14.5–17.0 s: CTA -->
    <div class="cta-title" id="t-cta">
      <span class="ln"><span class="li">Construyamos</span></span>
      <span class="ln"><span class="li">algo mejor</span></span>
    </div>
    <div class="rule-t cta-rule" id="t-ctarule"></div>
    <div class="cta-web" id="t-ctaweb">305WEBSERVICE.COM</div>
    <div class="qr-block" id="t-qr">
      <div class="qr-card"><img src="../src/assets/qr-305webservice.svg" alt="Código QR: https://305webservice.com"></div>
      <div class="qr-caption">Escanea para conocer más</div>
    </div>

    <div class="sub" id="sub"></div>
  </div>

  <script src="timeline.js"></script>
  <script>
    window.REEL = {
      total: 17000,
      bgs: [
        { t0: 0, theme: "navy" },
        { t0: 2500, theme: "paper" },
        { t0: 12500, theme: "navy" },
      ],
      tracks: [
        { id: "t-q", in: 0, out: 2500, enter: "lines", dur: 420, stagger: 90, exit: "fade", exitDur: 280 },
        { id: "t-p1", in: 2500, out: 5000, enter: "lines", dur: 420, exit: "fade", exitDur: 260 },
        { id: "t-p2", in: 5000, out: 7500, enter: "lines", dur: 420, exit: "fade", exitDur: 260 },
        { id: "t-p3", in: 7500, out: 10000, enter: "lines", dur: 420, exit: "fade", exitDur: 260 },
        { id: "t-p4", in: 10000, out: 12500, enter: "lines", dur: 420, stagger: 90, exit: "fade", exitDur: 260 },
        { id: "t-claim", in: 12500, out: 14500, enter: "lines", dur: 420, stagger: 90, exit: "fade", exitDur: 280 },
        { id: "t-cta", in: 14500, out: 17000, enter: "lines", dur: 400, stagger: 90 },
        { id: "t-ctarule", in: 14700, out: 17000, enter: "rule", dur: 350 },
        { id: "t-ctaweb", in: 14800, out: 17000, enter: "fade", dur: 350 },
        { id: "t-qr", in: 14500, out: 17000, enter: "static" },
      ],
      subs: [
        { t0: 400, t1: 4900, text: "Tu página debe verse profesional," },
        { t0: 5000, t1: 9900, text: "funcionar en cualquier dispositivo" },
        { t0: 10000, t1: 12400, text: "y convertir visitas en oportunidades." },
        { t0: 12500, t1: 16600, text: "No es solamente una página; es parte de tu negocio." },
      ],
    };
    initReel();
  </script>
</body>
</html>
