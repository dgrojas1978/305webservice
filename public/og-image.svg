<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#071426"/>
      <stop offset="100%" style="stop-color:#030B1A"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#030B1A;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#60A5FA"/>
      <stop offset="100%" style="stop-color:#2563EB"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Glow -->
  <ellipse cx="300" cy="200" rx="500" ry="350" fill="url(#glow)"/>
  <!-- Grid lines (subtle) -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="120" y1="0" x2="120" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/>
  </g>
  <!-- "305" large -->
  <text x="100" y="400" font-family="Inter, Arial Black, sans-serif" font-weight="900" font-size="300" letter-spacing="-10" fill="url(#accent)" opacity="0.12">305</text>
  <!-- Logo icon area -->
  <rect x="80" y="195" width="72" height="72" rx="14" fill="#0A1628" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="116" y="250" text-anchor="middle" font-family="Inter, Arial Black, sans-serif" font-weight="900" font-size="32" fill="#3B82F6">305</text>
  <!-- Brand name -->
  <text x="172" y="234" font-family="Inter, Arial Black, sans-serif" font-weight="900" font-size="42" fill="white" letter-spacing="-1">Web</text>
  <rect x="260" y="216" width="88" height="26" rx="13" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.2)" stroke-width="1"/>
  <text x="304" y="234" text-anchor="middle" font-family="Inter, sans-serif" font-weight="600" font-size="13" fill="#10B981">Service</text>
  <!-- Tagline -->
  <text x="80" y="310" font-family="Inter, sans-serif" font-weight="700" font-size="48" fill="white" letter-spacing="-1">Software que hace crecer</text>
  <text x="80" y="370" font-family="Inter, sans-serif" font-weight="700" font-size="48" letter-spacing="-1">
    <tspan fill="#60A5FA">tu negocio</tspan>
  </text>
  <!-- Subtitle -->
  <text x="80" y="430" font-family="Inter, sans-serif" font-weight="400" font-size="22" fill="rgba(148,163,184,0.8)">Ventaro ERP · Cambalache · FORTALEZA ZONA-0</text>
  <!-- Bottom accent line -->
  <rect x="80" y="530" width="120" height="4" rx="2" fill="url(#accent)"/>
  <text x="80" y="568" font-family="Inter, sans-serif" font-weight="500" font-size="18" fill="rgba(148,163,184,0.5)">305webservice.com</text>
</svg>
